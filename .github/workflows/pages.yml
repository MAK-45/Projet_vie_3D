# Publie l'Atelier Vie 3D (et les pages de site/) sur GitHub Pages à chaque push sur main.
# Réglage requis une fois : Settings > Pages > Source : « GitHub Actions » (le dépôt contient un lien symbolique,
# .claude/skills, que la publication depuis une branche refuse).
name: Publier le site sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4

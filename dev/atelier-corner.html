<!doctype html>
<!-- Coin de l'Atelier : les assets du lot 9 (établi central et établi d'horloger, tour à métaux, four à bobines,
     enclume sur souche et bloc d'essai, râtelier à outils) avec l'ossature du Complexe, et le mannequin de 1,80 m.
     Options : night=1, zoom, view, px, run=1 (le tour tourne), heat (full, standby, off), vise=1 (l'étau s'ouvre et se
     serre toutes les 3 s). /dev/atelier-corner.html?night=1 -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin de l'Atelier</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15111e; }
      #viewer { position: relative; overflow: hidden; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script type="module">
      import * as THREE from "three";
      import { Viewer } from "/src/gallery/viewer.js";
      import { disposeObject, sharedUniforms } from "/src/engine/toon-material.js";
      import { getAsset } from "/src/assets/index.js";
      import { setModelSource } from "/src/assets/kit/model.js";

      setModelSource({ base: "/models/" });
      const query = new URLSearchParams(location.search);
      const night = query.get("night") === "1";
      const make = (id, params, x, z, rotY = 0, y = 0) => {
        const object = getAsset(id).create(params);
        object.position.set(x, y, z);
        object.rotation.y = rotY;
        return object;
      };

      function create() {
        const group = new THREE.Group();
        // Sol : 4 × 3 dalles (8 × 6 m), tachées d'huile et de limaille par endroits.
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 3; j++) {
            const variant = (i * 3 + j) % 4 === 1 ? "stained" : (i + j) % 3 === 2 ? "worn" : "intact";
            group.add(make("buildings/structure/glyph-floor-slab", { seed: i * 7 + j + 40, variant }, -3 + i * 2, -2 + j * 2, 0, -0.2));
          }
        }
        // Murs de 5,5 m : le fond (z = −3,3) et la gauche (x = −4,3).
        group.add(make("buildings/structure/glyph-wall", { seed: 11, height: 5.5, width: 4 }, -2, -3.3));
        group.add(make("buildings/structure/glyph-wall", { seed: 12, height: 5.5, width: 4 }, 2, -3.3));
        group.add(make("buildings/structure/glyph-wall", { seed: 13, height: 5.5, width: 3 }, -4.3, -1.5, Math.PI / 2));
        group.add(make("buildings/structure/glyph-wall", { seed: 14, height: 5.5, width: 3 }, -4.3, 1.5, Math.PI / 2));
        // Le four dans l'angle du fond, l'enclume devant lui ; le tour au fond à droite ; le râtelier entre les deux.
        const heat = query.get("heat") ?? "full";
        group.add(make("props/machines/coil-furnace", { seed: 3, state: heat, halo: night ? "on" : "off" }, -2.7, -2.1));
        group.add(make("props/tools/anvil", { seed: 2 }, -1.5, -0.5, 0.4));
        group.add(make("furniture/storage/tool-rack", { seed: 4 }, 0.15, -3.05));
        group.add(make("props/machines/metal-lathe", { seed: 5, state: query.get("run") === "1" ? "running" : "idle" }, 2.55, -2.35));
        // L'établi central au milieu, sa lampe d'atelier à l'étau, un tabouret ; l'établi d'horloger contre le mur gauche.
        const bench = make("furniture/tables/workbench", { seed: 3, clutter: "used" }, 0.6, 0.55);
        group.add(bench);
        group.add(make("furniture/lighting/articulated-lamp", { seed: 6, kind: "workshop", mount: "clamp", halo: night ? "on" : "off" }, 1.6, 0.12, Math.PI, 0.92));
        group.add(make("furniture/seating/bronze-stool", { seed: 4, model: "workshop" }, 1.3, 1.35));
        group.add(make("furniture/tables/workbench", { seed: 7, kind: "watchmaker" }, -3.75, 1.7, Math.PI / 2));
        group.add(make("furniture/seating/bronze-stool", { seed: 8, model: "workshop" }, -3.0, 1.7));
        // Le bloc d'essai de la salle 4, à droite devant (pour l'échelle), et une lanterne au plafond.
        group.add(make("props/tools/anvil", { seed: 5, kind: "test-block" }, 2.9, 1.7));
        group.add(make("furniture/lighting/filament-chandelier", { seed: 2, halo: night ? "on" : "off", height: 3.4, chain: 1.8 }, 2.4, 0.2));
        // Le mannequin de 1,80 m devant l'établi.
        const mannequin = getAsset("creatures/humanoid/mannequin").create({});
        mannequin.position.set(-0.4, 0, 1.7);
        mannequin.rotation.y = 2.6;
        group.add(mannequin);
        group.userData.ready = mannequin.userData.ready;
        // vise=1 : l'étau de l'établi s'ouvre et se serre de lui-même.
        if (query.get("vise") === "1") {
          let next = 0, open = false;
          const base = group.updateMatrixWorld.bind(group);
          group.updateMatrixWorld = (force) => {
            const t = sharedUniforms.uTime.value;
            if (t >= next) {
              next = t + 3;
              open = !open;
              bench.userData.vise.setOpen(open ? 1 : 0, 1.2);
            }
            base(force);
          };
        }
        return group;
      }

      const module = { meta: { footprint: { radius: 5.5, height: 7 } }, create, dispose: disposeObject };
      const viewer = new Viewer(document.getElementById("viewer"));
      for (const name of ["pixelArt", "outline", "ground", "night"]) {
        if (query.has(name)) viewer.setOption(name, query.get(name) === "1");
      }
      if (query.has("px")) viewer.setOption("pixelSize", Number(query.get("px")));
      viewer.resize();
      viewer.setAsset(module, {});
      if (query.has("view")) viewer.resetView(query.get("view"));
      if (query.has("zoom")) {
        viewer.iso.camera.zoom = Number(query.get("zoom"));
        viewer.iso.camera.updateProjectionMatrix();
      }
      viewer.start();
      window.viewer = viewer;
    </script>
  </body>
</html>

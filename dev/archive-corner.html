<!doctype html>
<!-- Coin des Archives : les assets du lot 6 (rayonnages à tiroirs, échelle roulante, table de lecture, lampe articulée,
     cassettes et rouleau) assemblés avec l'ossature du Complexe, et le mannequin de 1,80 m pour l'échelle.
     Options : night=1, zoom, view, px, drawers (few, closed, many), slide=1 (un tiroir sort et rentre toutes les 3 s).
     /dev/archive-corner.html?night=1 -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin des Archives</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15111e; }
      #viewer { position: relative; overflow: hidden; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script type="module">
      import * as THREE from "three";
      import { Viewer } from "/src/gallery/viewer.js";
      import { disposeObject, sharedUniforms } from "/src/engine/toon-material.js";
      import { getAsset } from "/src/assets/index.js";
      import { setModelSource } from "/src/assets/kit/model.js";

      setModelSource({ base: "/models/" });
      const query = new URLSearchParams(location.search);
      const night = query.get("night") === "1";
      const make = (id, params, x, z, rotY = 0, y = 0) => {
        const object = getAsset(id).create(params);
        object.position.set(x, y, z);
        object.rotation.y = rotY;
        return object;
      };

      function create() {
        const group = new THREE.Group();
        // Sol : 4 × 3 dalles (8 × 6 m), dessus au niveau 0.
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 3; j++) {
            const variant = (i + j) % 3 === 1 ? "worn" : "intact";
            group.add(make("buildings/structure/glyph-floor-slab", { seed: i * 7 + j, variant }, -3 + i * 2, -2 + j * 2, 0, -0.2));
          }
        }
        // Murs de 7 m : le fond (z = −3,3) et la gauche (x = −4,3).
        group.add(make("buildings/structure/glyph-wall", { seed: 1, height: 7, width: 4 }, -2, -3.3));
        group.add(make("buildings/structure/glyph-wall", { seed: 2, height: 7, width: 4 }, 2, -3.3));
        group.add(make("buildings/structure/glyph-wall", { seed: 3, height: 7, width: 3 }, -4.3, -1.5, Math.PI / 2));
        group.add(make("buildings/structure/glyph-wall", { seed: 4, height: 7, width: 3 }, -4.3, 1.5, Math.PI / 2));
        // Deux rayonnages monumentaux contre le fond, l'échelle sur celui de gauche ; un rayonnage bas à gauche.
        const drawers = query.get("drawers") ?? "few";
        const left = make("furniture/storage/drawer-archive", { seed: 3, drawers }, -1.55, -3.0);
        const right = make("furniture/storage/drawer-archive", { seed: 8, drawers }, 1.55, -3.0);
        group.add(left, right);
        group.add(make("buildings/structure/rolling-ladder", { seed: 5, slide: 0.6 }, -1.55, -2.2));
        group.add(make("furniture/storage/drawer-archive", { seed: 11, width: 2, height: 2.4, drawers: "many" }, -4.0, 0.6, Math.PI / 2));
        // Colonne cannelée de 7 m (ARC-09).
        group.add(make("buildings/structure/glyph-column", { seed: 6, shape: "fluted", height: 7, diameter: 1 }, -3.1, 2.3));
        // Table de lecture, sa lampe, des cassettes et un rouleau ; la lanterne au-dessus.
        group.add(make("furniture/tables/stone-table", { seed: 4 }, 0.2, 0.4));
        group.add(make("furniture/lighting/articulated-lamp", { seed: 3, halo: night ? "on" : "off" }, 1.05, 0.15, -0.6, 0.85));
        group.add(make("props/books/data-cassette", { seed: 2, pose: "stack", count: 5 }, -0.5, 0.25, 0.3, 0.85));
        group.add(make("props/books/data-cassette", { seed: 7, pose: "stack", count: 3, color: "cyan" }, -0.3, 0.55, -0.4, 0.85));
        group.add(make("props/books/data-cassette", { seed: 5, pose: "standing", color: "green" }, 0.35, 0.2, 0.2, 0.85));
        group.add(make("props/books/data-cassette", { seed: 9, kind: "roll" }, 0.55, 0.45, 0.2, 0.85));
        group.add(make("furniture/lighting/filament-chandelier", { seed: 2, halo: night ? "on" : "off", height: 3.4, chain: 2.4 }, 0.2, 0.4));
        // Lot 7 : la lecture. Loupe et visionneuse sur la table, deux tabourets devant, le chariot à cassettes près des
        // rayonnages, une vitrine de conservation à droite.
        group.add(make("props/tools/arm-magnifier", { seed: 4 }, -0.75, 0.3, 0.5, 0.85));
        group.add(make("props/machines/crank-recorder", { seed: 3, state: query.get("run") === "1" ? "running" : "idle" }, 0.85, 0.62, -0.35, 0.85));
        group.add(make("furniture/seating/bronze-stool", { seed: 2 }, -0.35, 1.2, 0.3));
        group.add(make("furniture/seating/bronze-stool", { seed: 5 }, 0.75, 1.25, -0.2));
        group.add(make("props/machines/complex-cart", { seed: 3 }, 2.9, -1.55, -0.35));
        group.add(make("furniture/storage/display-case", { seed: 2 }, 2.7, 1.5, -Math.PI / 2 + 0.05));
        // Le mannequin de 1,80 m devant la table.
        const mannequin = getAsset("creatures/humanoid/mannequin").create({});
        mannequin.position.set(-1.0, 0, 1.6);
        mannequin.rotation.y = 2.6;
        group.add(mannequin);
        group.userData.ready = mannequin.userData.ready;
        // slide=1 : un tiroir sort et rentre de lui-même (la vie des Archives).
        if (query.get("slide") === "1") {
          let next = 0, out = false;
          const base = group.updateMatrixWorld.bind(group);
          group.updateMatrixWorld = (force) => {
            const t = sharedUniforms.uTime.value;
            if (t >= next) {
              next = t + 3;
              out = !out;
              right.userData.archive.slide(5, 8, out ? 1 : 0, 1.2);
            }
            base(force);
          };
        }
        return group;
      }

      const module = { meta: { footprint: { radius: 5.5, height: 7 } }, create, dispose: disposeObject };
      const viewer = new Viewer(document.getElementById("viewer"));
      for (const name of ["pixelArt", "outline", "ground", "night"]) {
        if (query.has(name)) viewer.setOption(name, query.get(name) === "1");
      }
      if (query.has("px")) viewer.setOption("pixelSize", Number(query.get("px")));
      viewer.resize();
      viewer.setAsset(module, {});
      if (query.has("view")) viewer.resetView(query.get("view"));
      if (query.has("zoom")) {
        viewer.iso.camera.zoom = Number(query.get("zoom"));
        viewer.iso.camera.updateProjectionMatrix();
      }
      viewer.start();
      window.viewer = viewer;
    </script>
  </body>
</html>

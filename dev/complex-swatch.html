<!doctype html>
<!-- Nuancier du Complexe : les matières (kit/palettes.js) et les briques (kit/complex-parts.js) côte à côte, pour
     vérifier qu'elles tiennent de jour comme dans le noir. Options : night=1 (setDarkness), px, zoom, view.
     /dev/complex-swatch.html?night=1 -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuancier du Complexe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15111e; }
      #viewer { position: relative; overflow: hidden; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script type="module">
      import * as THREE from "three";
      import { Viewer } from "/src/gallery/viewer.js";
      import { createGlowLight, createToonMaterial, rgb } from "/src/engine/toon-material.js";
      import { buildBlock, buildLathe, mergeGeometries } from "/src/assets/kit/geometry.js";
      import { createRng } from "/src/assets/kit/rng.js";
      import { FABRICS, GLASSES, GLOWS, METALS, STONES, WOODS } from "/src/assets/kit/palettes.js";
      import * as P from "/src/assets/kit/complex-parts.js";

      const query = new URLSearchParams(location.search);

      function create() {
        const group = new THREE.Group();
        const rng = createRng(7);
        const add = (geometry, material, x = 0, z = 0) => {
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(x, 0, z);
          mesh.castShadow = mesh.receiveShadow = true;
          group.add(mesh);
          return mesh;
        };

        // Rang 1 (fond) : un pan de mur de basalte avec bandeau de glyphes et suie, un pilier de pierre fumée.
        const wall = P.withTone(buildBlock([4, 3, 0.6], [0, 1.5, 0]), (x, y) => P.soot(1.6, 3, -0.24)(x, y) + (Math.floor(x / 1 + 10) % 2 ? 0.05 : -0.04));
        add(wall, P.stoneMaterial(STONES.blackBasalt, { seed: 3, id: 20 }), 0, -3);
        const strip = P.glyphStrip(rng, { length: 3.8, rows: 2 });
        strip.translate(0, 1.1, 0.3);
        add(strip, P.glowMaterial("amber", { level: 2 }), 0, -3);
        const pier = P.withTone(buildBlock([0.9, 3, 0.9], [0, 1.5, 0]), P.soot(1.8, 3, -0.24));
        add(pier, P.stoneMaterial(STONES.smoked, { seed: 4, id: 21 }), 2.8, -3);
        add(mergeGeometries([P.squareRing({ size: 0.9, y: 1.2 }), P.squareRing({ size: 0.9, y: 2.4 })]), P.metalMaterial(METALS.patinatedBronze), 2.8, -3);
        // Dalles de sol (basalte, tons alternés, une usée au centre).
        for (let i = 0; i < 3; i++) {
          const slab = P.withTone(buildBlock([1.96, 0.2, 1.96], [0, 0.1, 0]), (x, y, z) => (i === 2 ? 0.25 * Math.max(0, 1 - Math.hypot(x, z)) : (i - 1) * 0.04));
          add(slab, P.stoneMaterial(STONES.blackBasalt, { seed: 5 + i, id: 22 }), -2 + i * 2, -0.9);
        }

        // Rang 2 : métaux, bois, cuirs, verres (fûts de 0,4 m).
        const swatches = [
          METALS.patinatedBronze, METALS.blackenedBrass, METALS.oxidizedCopper, METALS.castIron,
          WOODS.blackenedOak, FABRICS.tarredLeather, FABRICS.felt, GLASSES.amber, GLASSES.cyan, GLASSES.smoky,
        ];
        swatches.forEach((entry, i) => {
          const geometry = mergeGeometries([
            buildLathe([[0, 0], [0.22, 0], [0.22, 0.5], [0, 0.5]], { segments: 10, facets: true }),
            buildBlock([0.3, 0.3, 0.3], [0, 0.65, 0], [0.4, 0.6, 0]),
          ]);
          const material = METALS[Object.keys(METALS).find((k) => METALS[k] === entry)]
            ? P.metalMaterial(entry, { id: 30 + i })
            : createToonMaterial({ ramp: entry.ramp, ink: entry.ink, crease: true, id: 30 + i });
          add(geometry, material, -2.25 + i * 0.5, 1.2);
        });

        // Rang 3 : lueurs (ampoules aux 4 niveaux), cadran, levier, rivets, chaîne, câble, glyphes à courbes.
        Object.keys(GLOWS).forEach((name, row) => {
          for (let level = 0; level < 4; level++) {
            add(P.bulb({ radius: 0.1, position: [0, 0.6, 0] }), P.glowMaterial(name, { level, id: 40 + row }), -2.4 + level * 0.3, 2.4 + row * 0.4);
          }
        });
        const plate = buildBlock([0.8, 0.6, 0.06], [0, 0.6, 0]);
        add(plate, P.metalMaterial(METALS.blackenedBrass, { id: 50 }), 0, 3);
        const d = P.dial({ radius: 0.12, position: [-0.2, 0.7, 0.03] });
        add(d.face, P.metalMaterial(GLASSES.smoky, { id: 51 }), 0, 3);
        add(d.marks, P.glowMaterial("amber", { level: 2, id: 52 }), 0, 3);
        const lv = P.lever({ position: [0.2, 0.5, 0.03], angle: 0.6, length: 0.25 });
        add(lv.rod, P.metalMaterial(METALS.patinatedBronze, { id: 53 }), 0, 3);
        add(lv.knob, P.metalMaterial(METALS.blackenedBrass, { id: 54 }), 0, 3);
        add(P.rivetRow([-0.35, 0.36, 0.03], [0.35, 0.36, 0.03], { spacing: 0.1 }), P.metalMaterial(METALS.patinatedBronze, { id: 55 }), 0, 3);
        add(P.chain([0, 1.6, 0], [1.4, 1.6, 0], { sag: 0.4 }), P.metalMaterial(METALS.patinatedBronze, { id: 56 }), 0.8, 2.6);
        add(P.cable([[0, 0.05, 0], [0.5, 0.05, 0.3], [1, 0.3, 0.1], [1.4, 0.05, 0.4]], { radius: 0.035 }), createToonMaterial({ ramp: FABRICS.tarredLeather.ramp, ink: FABRICS.tarredLeather.ink, id: 57 }), 0.8, 3.2);
        const curved = P.glyphStrip(rng, { length: 1.2, rows: 4, style: "curved" });
        curved.translate(0, 0.3, 0.03);
        add(buildBlock([1.3, 0.9, 0.06], [0, 0.45, 0]), createToonMaterial({ ramp: ["#8a8478", "#b9b2a2", "#e8e2d4", "#fbf8f0"], ink: "#4a453c", crease: true, id: 58 }), 0.9, 4.2);
        add(curved, P.glowMaterial("cyan", { level: 2, id: 59 }), 0.9, 4.2);

        const light = createGlowLight();
        const lightPos = new THREE.Vector3(-1.95, 0.9, 2.4);
        const lightColor = rgb(GLOWS.amber.light);
        group.userData.update = () => light.set(lightPos, lightColor, 2.6, 1);
        group.userData.dispose = () => light.release();
        return group;
      }

      const module = { meta: { footprint: { radius: 4.2, height: 3 } }, create };
      const viewer = new Viewer(document.getElementById("viewer"));
      for (const name of ["pixelArt", "outline", "ground", "night"]) {
        if (query.has(name)) viewer.setOption(name, query.get(name) === "1");
      }
      if (query.has("px")) viewer.setOption("pixelSize", Number(query.get("px")));
      viewer.resize();
      viewer.setAsset(module, {});
      viewer.asset.userData.update();
      if (query.has("view")) viewer.resetView(query.get("view"));
      if (query.has("zoom")) {
        viewer.iso.camera.zoom = Number(query.get("zoom"));
        viewer.iso.camera.updateProjectionMatrix();
      }
      viewer.start();
      window.viewer = viewer;
    </script>
  </body>
</html>
